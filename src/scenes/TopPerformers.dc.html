<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:transparent}a{color:#4C39CA;text-decoration:none}a:hover{color:#110663}</style></helmet>
<div style="width:100%; background:#F6F5FA; border-radius:24px; box-shadow:0 1px 3px rgba(17,6,99,0.06), 0 12px 32px rgba(17,6,99,0.10); padding:22px 22px 18px; display:flex; flex-direction:column; gap:14px; font-family:'Nunito Sans', 'Readex Pro', system-ui, sans-serif; box-sizing:border-box">
  <div style="display:flex; align-items:center; gap:14px"><span style="position:relative; width:36px; height:36px; flex:none"><span style="position:absolute; inset:0; border-radius:999px; background:#F4EBFF; filter:blur(3px)"></span><svg viewBox="0 0 28 28" fill="none" style="position:absolute; inset:6px; width:24px; height:24px"><path d="M17.5 1.75L15.75 10.5L22.75 13.125L10.5 26.25L12.25 17.5L5.25 14.875L17.5 1.75Z" stroke="#4C39CA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="font-size:20px; font-weight:700; color:#0F172A">Top performers</span></div>
  <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap">
    <div style="display:flex; gap:10px"><span style="height:34px; padding:0 12px; border:1px solid #E2E8F0; border-radius:10px; display:inline-flex; align-items:center; gap:8px; font-size:13px; color:#0F172A">{{ month }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg></span><span style="height:34px; padding:0 12px; border:1px solid #E2E8F0; border-radius:10px; display:inline-flex; align-items:center; gap:8px; font-size:13px; color:#0F172A">{{ year }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg></span></div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px"><span style="font-size:12px; color:#94A3B8">Targets by</span><span style="display:flex; gap:6px"><span style="padding:7px 12px; font-size:11px; font-weight:700; border-radius:10px; background:#4C3CB4; color:#FFFFFF">Month</span><span style="padding:7px 12px; font-size:11px; font-weight:700; border-radius:10px; background:#E2E8F0; color:#2D2566">Quarter</span><span style="padding:7px 12px; font-size:11px; font-weight:700; border-radius:10px; background:#E2E8F0; color:#2D2566">Year</span></span></div>
  </div>
  <span style="font-size:14px; color:#64748B; padding:4px 4px 0">Top 3 performers</span>
  <div style="display:flex; flex-direction:column; gap:8px">
    <sc-for list="{{ board }}" as="r" hint-placeholder-count="5">
      <div style="{{ r.row }}">
        <span aria-hidden="true" style="{{ r.blob3 }}"></span><span aria-hidden="true" style="{{ r.blob2 }}"></span><span aria-hidden="true" style="{{ r.blob1 }}"></span>
        <span style="{{ r.avatar }}">{{ r.ini }}</span>
        <span style="{{ r.nameStyle }}">{{ r.name }}</span>
        <span style="position:relative; z-index:5; flex:1; min-width:0; height:22px; border-radius:999px; background:#E4E1F0; box-shadow:inset 0 1px 2px rgba(17,6,99,0.10); display:flex; overflow:hidden"><span style="{{ r.bar }}"></span><span style="{{ r.pctStyle }}">{{ r.pctText }}</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:relative; z-index:5; flex:none; margin:0 6px 0 4px"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:520},&quot;reps&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;Array&lt;[string, number]&gt;&quot;}}">
class Component extends DCLogic {
  state = { fill: false };
  componentDidMount() { this._t = setTimeout(() => this.setState({ fill: true }), 250); }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const now = new Date(); const M = ['January','February','March','April','May','June','July','August','September','October','November','December'][now.getMonth()];
    const reps = this.props.reps || [['Marie Carter', 108], ['Jordan Reyes', 100], ['Amara Okafor', 84], ['Sofie Berg', 71], ['Kai Brooks', 63]];
    const themes = [['#FDD65B', '#FEE9A8', '#FFF6DB', 'linear-gradient(90deg, #A16207, #EAB308)'], ['#86EFAC', '#BBF7D0', '#E8FBEF', 'linear-gradient(90deg, #027A48, #22C55E)'], ['#B9A8EC', '#D9CFF6', '#EEEAFB', 'linear-gradient(90deg, #2217B7, #7C5CE6)']];
    const rowH = 64; const fill = this.state.fill;
    const board = reps.map((r, i) => {
      const th = themes[i]; const podium = i < 3; const pct = r[1];
      const blob = (w, c, z) => ({ position: 'absolute', left: '-40px', top: '-70px', width: w + 'px', height: '150px', borderRadius: '48% 52% 60% 40% / 55% 45% 55% 45%', background: podium ? c : 'transparent', zIndex: z, pointerEvents: 'none' });
      const pctW = Math.max(3, Math.min(100, pct));
      return { name: r[0], ini: r[0].split(' ').map((w) => w[0]).join(''), pctText: pct + '%',
        row: { position: 'relative', overflow: 'hidden', height: rowH + 'px', borderRadius: '18px', background: '#FFFFFF', border: '1px solid rgba(17,6,99,0.12)', display: 'flex', alignItems: 'center', gap: '12px', padding: '0 4px 0 12px', boxShadow: '0 1px 2px rgba(17,6,99,0.06), 0 4px 12px rgba(17,6,99,0.06)' },
        blob1: blob(200, th ? th[0] : '', 3), blob2: blob(290, th ? th[1] : '', 2), blob3: blob(360, th ? th[2] : '', 1),
        avatar: { position: 'relative', zIndex: 5, width: podium ? '40px' : '34px', height: podium ? '40px' : '34px', borderRadius: '999px', flex: 'none', display: 'grid', placeItems: 'center', background: '#FFFFFF', border: '1px solid #F1F5F9', boxShadow: '0 1px 3px rgba(15,23,42,0.12)', fontSize: '12px', fontWeight: 700, color: '#0F172A' },
        nameStyle: { position: 'relative', zIndex: 5, width: podium ? '128px' : '118px', flex: 'none', fontSize: podium ? '15px' : '14px', fontWeight: 700, color: '#0F172A', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' },
        bar: { display: 'block', height: '100%', width: (fill ? pctW : 0) + '%', borderRadius: '999px', background: th ? th[3] : 'linear-gradient(90deg, #027A48, #22C55E)', transition: 'width 900ms cubic-bezier(0.2,0.6,0.2,1) ' + (i * 90) + 'ms' },
        pctStyle: { position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', fontSize: '12px', fontWeight: 700, color: fill && pctW > 50 ? '#FFFFFF' : '#110663', textShadow: fill && pctW > 50 ? '0 1px 2px rgba(0,0,0,0.25)' : 'none', fontVariantNumeric: 'tabular-nums', transition: 'color 200ms ' + (i * 90 + 450) + 'ms' } };
    });
    return { board, month: M, year: String(now.getFullYear()) };
  }
}
</script>
</body>
</html>
