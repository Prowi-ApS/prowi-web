<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes ckInA{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ckInB{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){[data-ck-body]{animation:none !important}}
</style>
</helmet>
<div style="width:100%; box-sizing:border-box; padding:4% 3% 0">
<div aria-label="{{ ckLabel }}" style="position:relative; width:100%; max-width:100%; filter:drop-shadow(0 30px 40px rgba(17,6,99,0.22))">
  <div style="position:relative; border-radius:14px 14px 4px 4px; background:linear-gradient(180deg, #2A2A30 0%, #16161B 100%); padding:8px 8px 11px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)">
    <span aria-hidden="true" style="position:absolute; top:2.5px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:999px; background:#0A0A0D; box-shadow:inset 0 0 0 1.5px #1F1F26"></span>
    <div style="border-radius:6px; overflow:hidden; background:#F9FBFC; color:#0F172A; font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display:flex; flex-direction:column">
      <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; background:#F9FBFC; border-bottom:1px solid #E2E8F0"><span aria-hidden="true" style="display:inline-flex; gap:5px; flex:none"><span style="width:9px; height:9px; border-radius:999px; background:#FF5F57"></span><span style="width:9px; height:9px; border-radius:999px; background:#FEBC2E"></span><span style="width:9px; height:9px; border-radius:999px; background:#28C840"></span></span><span style="flex:1; min-width:0; display:flex; justify-content:center"><span style="display:inline-flex; align-items:center; height:20px; padding:0 10px; border-radius:6px; background:#FFFFFF; border:1px solid #E2E8F0; font-size:10px; color:#64748B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%">app.prowi.io/dashboards/financial-commission</span></span></div>
      <div style="padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap">
          <span style="display:flex; flex-direction:column; gap:2px; min-width:0"><span style="font-size:12px; font-weight:600">Financial Commission Overview</span><span style="font-size:8.5px; color:#64748B; white-space:nowrap">{{ rangeLabel }}</span></span>
          <span role="tablist" aria-label="Grouping period" style="display:inline-flex; gap:0; background:#F1F5F9; border-radius:6px; padding:2px; flex:none"><button type="button" role="tab" aria-selected="{{ isMonth }}" onClick="{{ setMonth }}" style="{{ gM }}">Month</button><button type="button" role="tab" aria-selected="{{ isQuarter }}" onClick="{{ setQuarter }}" style="{{ gQ }}">Quarter</button><button type="button" role="tab" aria-selected="{{ isYear }}" onClick="{{ setYear }}" style="{{ gY }}">Year</button></span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <div style="position:relative; overflow:hidden; border-radius:14px; background:#6366F1; color:#FFFFFF; padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:4px; min-height:74px"><span aria-hidden="true" style="position:absolute; width:120px; height:120px; left:-40px; top:-60px; border-radius:50%; background:rgba(255,209,221,0.28); filter:blur(30px)"></span><span aria-hidden="true" style="position:absolute; width:120px; height:120px; right:-40px; bottom:-60px; border-radius:50%; background:rgba(255,209,221,0.28); filter:blur(30px)"></span><span style="position:relative; font-size:9px; font-weight:300; opacity:0.9">Total Payout</span><span style="position:relative; font-size:22px; font-weight:700; letter-spacing:-0.02em; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap">{{ ckTotal }}</span><span style="{{ trendS }}">{{ trend }}</span></div>
          <div style="position:relative; overflow:hidden; border-radius:14px; background:linear-gradient(180deg, #4C3CB4 0%, #71D0F3 100%); color:#FFFFFF; padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:4px; min-height:74px"><span aria-hidden="true" style="position:absolute; width:110px; height:110px; right:-30px; top:-20px; border-radius:46% 54% 60% 40% / 50% 40% 60% 50%; background:rgba(70,211,247,0.3)"></span><span aria-hidden="true" style="position:absolute; width:90px; height:90px; right:10px; bottom:-40px; border-radius:60% 40% 50% 50% / 40% 60% 40% 60%; background:rgba(70,211,247,0.22)"></span><span style="position:relative; font-size:9px; font-weight:300; opacity:0.9">Average per Period</span><span style="position:relative; font-size:22px; font-weight:700; letter-spacing:-0.02em; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap">{{ ckComm }}</span><span style="position:relative; font-size:8px; opacity:0.85">{{ perLabel }}</span></div>
        </div>
        <div style="background:#FFFFFF; border-radius:8px; box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05); padding:12px 14px; display:flex; flex-direction:column; gap:8px">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap">
            <span style="display:inline-flex; align-items:center; gap:8px; min-width:0"><span style="font-size:11px; font-weight:500; white-space:nowrap">{{ chartTitle }}</span><span role="tablist" aria-label="Chart" style="display:inline-flex; background:#F1F5F9; border-radius:6px; padding:2px"><button type="button" role="tab" aria-selected="{{ isTime }}" onClick="{{ setTime }}" style="{{ tT }}">Payouts</button><button type="button" role="tab" aria-selected="{{ isDist }}" onClick="{{ setDist }}" style="{{ tD }}">Distribution</button></span></span>
            <span style="display:flex; gap:10px; font-size:8px; color:#94A3B8"><span style="display:inline-flex; align-items:center; gap:4px"><span style="width:7px; height:7px; border-radius:2px; background:#34D399"></span>Paid</span><span style="display:inline-flex; align-items:center; gap:4px"><span style="width:7px; height:7px; border-radius:2px; background:#FBBF24"></span>Awaiting Approval</span><span style="display:inline-flex; align-items:center; gap:4px"><span style="width:7px; height:7px; border-radius:2px; background:#4C39CA"></span>Current</span></span>
          </div>
          <div data-ck-body="1" style="{{ bodyS }}">
            <sc-if value="{{ isTime }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex; gap:2px; align-items:flex-end; border-bottom:1px solid #E2E8F0; padding-bottom:4px">
                <sc-for list="{{ bars }}" as="b" hint-placeholder-count="12">
                  <div style="display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; flex:1">
                    <span style="font-size:8px; font-weight:500; color:#64748B; font-variant-numeric:tabular-nums; white-space:nowrap">{{ b.v }}</span>
                    <span style="width:70%; max-width:38px; height:100px; display:flex; flex-direction:column; justify-content:flex-end"><sc-for list="{{ b.segs }}" as="s" hint-placeholder-count="1"><span style="{{ s.st }}"></span></sc-for></span>
                    <span style="font-size:8px; color:#94A3B8; white-space:nowrap">{{ b.l }}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ isDist }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; gap:6px">
                <div style="position:relative; width:26px; height:104px; flex:none"><sc-for list="{{ ticks }}" as="k" hint-placeholder-count="5"><span style="{{ k.st }}">{{ k.l }}</span></sc-for></div>
                <div style="flex:1; min-width:0; display:flex; flex-direction:column">
                  <div style="position:relative; height:104px; border-bottom:1px solid #E2E8F0">
                    <div style="position:absolute; inset:0; display:flex"><sc-for list="{{ cols }}" as="c" hint-placeholder-count="6"><div onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="{{ c.hl }}"></div></sc-for></div>
                    <svg aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="24"><circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="3.5" fill="{{ d.fill }}" fill-opacity="0.92"></circle></sc-for></svg>
                  </div>
                  <div style="display:flex; padding-top:5px"><sc-for list="{{ cols }}" as="c" hint-placeholder-count="6"><div style="{{ c.lb }}"><span style="width:16px; height:16px; border-radius:999px; background:#E2E8F0; color:#475569; font-size:7px; font-weight:600; display:grid; place-items:center; line-height:1">{{ c.ini }}</span><span style="font-size:8px; color:#94A3B8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%">{{ c.first }}</span></div></sc-for></div>
                </div>
              </div>
            </sc-if>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div aria-hidden="true" style="position:relative; height:12px; margin:0 -3%; border-radius:0 0 12px 12px; background:linear-gradient(180deg, #D5D5DA 0%, #B8B8BF 55%, #8E8E96 100%)"><span style="position:absolute; top:0; left:50%; width:22%; height:4px; margin-left:-11%; border-radius:0 0 6px 6px; background:#9A9AA2"></span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:520},&quot;currency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;EUR&quot;,&quot;options&quot;:[&quot;EUR&quot;,&quot;DKK&quot;],&quot;tsType&quot;:&quot;'EUR' | 'DKK'&quot;}}">
class Component extends DCLogic {
  state = { gran: 'month', view: 'time', hover: -1, tick: 0 };
  static MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // last 12 months of commission in EUR, index 11 = current month; older months scale down 11% per year
  static BASE = [128200, 135400, 176300, 120100, 131500, 163200, 142400, 150300, 188100, 158600, 180100, 168400];
  static REPS = ['Jordan Carter', 'Maya Chen', 'Luis Ortega', 'Emily Brooks', 'Noah Patel', 'Ava Johnson'];
  static SHARE = [0.21, 0.18, 0.17, 0.16, 0.15, 0.13];
  static COL = { cur: '#4C39CA', aw: '#FBBF24', paid: '#34D399' };
  mval(k) { const B = Component.BASE; return Math.round(B[((11 - (k % 12)) % 12 + 12) % 12] * Math.pow(0.89, Math.floor(k / 12))); }
  // statement status by age: this period is current, last period awaits approval (two thirds), older is paid
  msplit(k, v) { if (k === 0) return { cur: v, aw: 0, paid: 0 }; if (k === 1) { const aw = Math.round(v * 0.66); return { cur: 0, aw, paid: v - aw }; } return { cur: 0, aw: 0, paid: v }; }
  periods(gran, now) {
    const y = now.getFullYear(), m = now.getMonth(), cur = y * 12 + m, out = [];
    if (gran === 'month') { for (let i = 11; i >= 0; i--) { const d = new Date(y, m - i, 1); out.push({ label: Component.MON[d.getMonth()], ks: [i], y: d.getFullYear(), mi: d.getMonth() }); } }
    else if (gran === 'quarter') { const abs0 = y * 4 + Math.floor(m / 3); for (let q = 3; q >= 0; q--) { const abs = abs0 - q, qy = Math.floor(abs / 4), qi = abs % 4, ks = []; for (let mm = qi * 3; mm < qi * 3 + 3; mm++) { const k = cur - (qy * 12 + mm); if (k >= 0) ks.push(k); } out.push({ label: 'Q' + (qi + 1) + ' ' + qy, ks }); } }
    else { for (let yy = y - 2; yy <= y; yy++) { const ks = []; for (let mm = 0; mm < 12; mm++) { const k = cur - (yy * 12 + mm); if (k >= 0) ks.push(k); } out.push({ label: String(yy), ks }); } }
    return out;
  }
  renderVals() {
    const { gran, view, hover, tick } = this.state;
    const dkk = (this.props.currency ?? 'EUR') === 'DKK', fx = dkk ? 2.5 : 1;
    const money = (v) => dkk ? Math.round(v * fx).toLocaleString('da-DK') + ' kr.' : '€ ' + Math.round(v).toLocaleString('da-DK');
    const abbr = (v) => { v = v * fx; if (v >= 1e6) { const s = (v / 1e6).toFixed(v >= 1e7 ? 0 : 1); return s.replace(/\.0$/, '') + 'M'; } return v >= 1e3 ? Math.round(v / 1e3) + 'K' : String(Math.round(v)); };
    const now = new Date();
    const per = this.periods(gran, now).map((p) => { const segs = { cur: 0, aw: 0, paid: 0 }; let v = 0; p.ks.forEach((k) => { const mv = this.mval(k); v += mv; const s = this.msplit(k, mv); segs.cur += s.cur; segs.aw += s.aw; segs.paid += s.paid; }); return Object.assign({ v, segs }, p); });
    const total = per.reduce((s, p) => s + p.v, 0), span = Math.max(...per.flatMap((p) => p.ks)) + 1;
    const prev = per.reduce((s, p) => s + p.ks.reduce((t, k) => t + this.mval(k + span), 0), 0);
    const tr = prev > 0 ? (total / prev - 1) * 100 : 0;
    const max = Math.max(...per.map((p) => p.v)) || 1;
    const bars = per.map((p) => { const order = [['cur', Component.COL.cur], ['aw', Component.COL.aw], ['paid', Component.COL.paid]].filter(([k]) => p.segs[k] > 0); return { l: p.label, v: abbr(p.v), segs: order.map(([k, bg], i) => ({ st: { display: 'block', height: (p.segs[k] / max * 94).toFixed(1) + '%', background: bg, borderRadius: i === 0 ? '4px 4px 0 0' : '0', transition: 'height 520ms cubic-bezier(0.2,0.8,0.2,1)' } })) }; });
    // distribution: one statement per rep per period, column per rep (alphabetical like the app), jittered inside the column
    const reps = Component.REPS.slice().sort((a, b) => a.localeCompare(b)), n = reps.length, order = Component.REPS.map((r) => reps.indexOf(r));
    const jitter = (i) => ((((i * 2654435761) >>> 0) / 4294967296) - 0.5) * 0.3;
    const pts = []; let ymax = 0;
    per.forEach((p, pi) => { const k0 = Math.min(...p.ks); const fill = k0 === 0 ? Component.COL.cur : k0 === 1 ? Component.COL.aw : Component.COL.paid; Component.REPS.forEach((r, ri) => { const v = p.v * Component.SHARE[ri] * (1 + 0.28 * Math.sin(ri * 1.7 + pi * 2.3 + 0.4)); ymax = Math.max(ymax, v); pts.push({ col: order[ri], v, fill, j: jitter(pi * n + ri) }); }); });
    const yTop = ymax * 1.1 || 1, pow = Math.pow(10, Math.floor(Math.log10(yTop / 4))), f = yTop / 4 / pow, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * pow;
    const ticks = []; for (let t = 0; t <= yTop; t += step) ticks.push({ l: abbr(t), st: { position: 'absolute', right: 0, bottom: 'calc(' + (t / yTop * 100).toFixed(2) + '% - 4px)', fontSize: '7.5px', color: '#94A3B8', fontVariantNumeric: 'tabular-nums', lineHeight: 1 } });
    const dots = pts.map((p) => ({ cx: (((p.col + 0.5) / n) * 100 + p.j * (100 / n)).toFixed(2) + '%', cy: (100 - p.v / yTop * 100).toFixed(2) + '%', fill: p.fill }));
    const cols = reps.map((r, i) => { const parts = r.split(' '); return { first: parts[0], ini: (parts[0][0] + parts[parts.length - 1][0]).toUpperCase(), enter: () => this.setState({ hover: i }), leave: () => this.setState({ hover: -1 }), hl: { flex: 1, minWidth: 0, borderRadius: '6px', background: hover === i ? 'rgba(148,163,184,0.1)' : 'transparent', transition: 'background 160ms ease-out' }, lb: { flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '3px', opacity: hover >= 0 && hover !== i ? 0.6 : 1, transition: 'opacity 160ms ease-out' } }; });
    const first = per[0], last = per[per.length - 1];
    const rangeLabel = gran === 'month' ? Component.MON[first.mi] + ' ' + first.y + ' – ' + Component.MON[last.mi] + ' ' + last.y : first.label + ' – ' + last.label;
    const seg = (on) => ({ border: 0, cursor: 'pointer', fontFamily: 'inherit', fontSize: '9px', fontWeight: on ? 600 : 500, padding: '3px 8px', borderRadius: '4px', background: on ? '#FFFFFF' : 'transparent', color: on ? '#0F172A' : '#94A3B8', boxShadow: on ? '0 1px 2px rgba(15,23,42,0.08)' : 'none', transition: 'background 160ms ease-out, color 160ms ease-out', lineHeight: 1.3 });
    const set = (patch) => this.setState((s) => Object.assign({ tick: s.tick + 1, hover: -1 }, patch));
    return {
      ckLabel: dkk ? 'Prowis økonomioverblik i en browser' : 'Prowi financial overview in a browser',
      ckTotal: money(total), ckComm: money(total / per.length), perLabel: per.length + (gran === 'month' ? ' months' : gran === 'quarter' ? ' quarters' : ' years'),
      trend: (tr >= 0 ? '+' : '−') + Math.abs(tr).toFixed(1) + '% vs previous period', trendS: { position: 'relative', fontSize: '8px', color: tr >= 0 ? '#86EFAC' : '#FCA5A5' },
      rangeLabel, chartTitle: view === 'time' ? 'Commission Over Time' : 'Commission Distribution',
      isMonth: gran === 'month', isQuarter: gran === 'quarter', isYear: gran === 'year', isTime: view === 'time', isDist: view === 'dist',
      setMonth: () => set({ gran: 'month' }), setQuarter: () => set({ gran: 'quarter' }), setYear: () => set({ gran: 'year' }), setTime: () => set({ view: 'time' }), setDist: () => set({ view: 'dist' }),
      gM: seg(gran === 'month'), gQ: seg(gran === 'quarter'), gY: seg(gran === 'year'), tT: seg(view === 'time'), tD: seg(view === 'dist'),
      bodyS: { animation: (tick % 2 ? 'ckInB' : 'ckInA') + ' 460ms cubic-bezier(0.2,0.8,0.2,1) both' },
      bars, ticks, dots, cols
    };
  }
}
</script>
</body>
</html>
