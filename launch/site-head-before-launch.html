<!-- 8) Automatic 3P mode + LCP image marker -->
<script>
  (function(){
    var p=(location.pathname||'').toLowerCase();
    var early=/^\/(pris|kontakt|book-demo)\/?$/.test(p);
    document.addEventListener('DOMContentLoaded',function(){
      document.body.setAttribute('data-3p-mode', early ? 'early' : 'balanced');
      var img=document.querySelector('.tella-thumb');
      if(img){
        img.setAttribute('data-lcp','');
        img.setAttribute('fetchpriority','high');
        img.setAttribute('loading','eager');
      }
    });
  })();
</script>
